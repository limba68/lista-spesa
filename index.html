<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista della Spesa Protetta & Promo</title>
    <style>
        :root { --primary: #4CAF50; --accent: #ff5722; --print-btn: #2196F3; --danger: #e74c3c; --dark: #2c3e50; --light: #f8f9fa; --white: #ffffff; --border: #cbd5e1; --promo-color: #eab308; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--light); color: var(--dark); padding: 20px; max-width: 800px; margin: 0 auto; min-height: 100vh; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; }
        .login-box { background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 360px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--border); border-radius: 8px; text-align: center; font-size: 16px; }
        #app-screen { display: none; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-logout { padding: 8px 14px; font-size: 0.9rem; background: #7f8c8d; border-radius: 6px; }
        .flyers-container { display: flex; gap: 10px; margin-bottom: 16px; }
        .flyer-card { flex: 1; background: var(--white); padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; color: var(--dark); font-weight: bold; font-size: 0.9rem; border: 1px solid var(--border); }
        .flyer-card.conad { border-left: 5px solid #ffcc00; } .flyer-card.iperpan { border-left: 5px solid #b91c1c; }
        .input-container { display: flex; gap: 10px; margin-bottom: 12px; }
        .input-container input { flex: 1; padding: 14px; font-size: 16px; border: 2px solid var(--border); border-radius: 8px; background: white; color: var(--dark); }
        .promo-toggle-container { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 0.95rem; cursor: pointer; }
        .controls { display: flex; gap: 12px; margin-bottom: 20px; }
        button { padding: 14px 10px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--white); }
        .btn-main { background-color: var(--primary); }
        #btn-vocal { flex: 1; background: var(--accent); }
        #btn-vocal.listening { background: #e64a19; animation: pulse 1.5s infinite; }
        #btn-print { flex: 1; background: var(--print-btn); }
        .btn-clear-all { width: 100%; background: var(--danger); margin-top: 20px; }
        ul { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; list-style: none; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--white); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        li.is-promo-item { border: 1px solid var(--promo-color); background: #fefce8; }
        .item-content { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; overflow: hidden; }
        li input[type="checkbox"] { transform: scale(1.3); accent-color: var(--primary); }
        .quantity-badge { background: #edf2f7; font-weight: bold; padding: 6px 10px; border-radius: 6px; color: var(--dark); }
        .promo-badge { background: var(--promo-color); color: #000; font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
        .item-text { font-size: 1.05rem; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .completed { opacity: 0.6; } .completed .item-text { text-decoration: line-through; color: #95a5a6; }
        .btn-delete { background: none; color: #e74c3c; font-size: 1.2rem; padding: 4px; margin-left: 8px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        @media (max-width: 580px) { ul { grid-template-columns: 1fr; gap: 8px; } }
        @media print {
            body { background: white; color: #000; padding: 0; }
            #login-screen, .controls, .input-container, .btn-delete, .btn-clear-all, .btn-logout, .flyers-container, .promo-toggle-container { display: none !important; }
            #app-screen { display: block !important; }
            ul { grid-template-columns: repeat(2, 1fr) !important; gap: 15px !important; display: grid !important; }
            li { box-shadow: none; border-bottom: 1px solid #cbd5e1; border-radius: 0; padding: 8px 0; }
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2 id="login-title">🔒 Area Riservata</h2>
            <p id="login-desc">Inserisci la password per accedere</p>
            <form onsubmit="checkPassword(event)">
                <input type="password" id="password-input" placeholder="Password..." required>
                <button type="submit" class="btn-main" style="width:100%">Accedi</button>
            </form>
        </div>
    </div>
    <div id="app-screen">
        <div class="header-container">
            <h1>🛒 SpesaApp & Promo</h1>
            <button class="btn-logout" onclick="logout()">Esci</button>
        </div>
        <div class="flyers-container">
            <a href="https://conad.it" target="_blank" class="flyer-card conad">Volantino Conad</a>
            <a href="supermercartipan.it" target="_blank" class="flyer-card iperpan">Volantino Iperpan</a>
        </div>
        <form class="input-container" onsubmit="addItemManual(event)">
            <input type="text" id="item-input" placeholder="Aggiungi articolo..." required>
            <button type="submit" class="btn-main">Aggiungi</button>
        </form>
        <label class="promo-toggle-container">
            <input type="checkbox" id="promo-checkbox"> <span>In offerta sul volantino (% sconto)</span>
        </label>
        <div class="controls">
            <button id="btn-vocal" type="button" onclick="startVoiceRecognition()">🎙️ Parla</button>
            <button id="btn-print" type="button" onclick="window.print()">🖨️ Stampa</button>
        </div>
        <ul id="shopping-list"></ul>
        <button class="btn-clear-all" onclick="clearAllItems()">🗑️ Svuota Intera Lista</button>
    </div>
    <script>
        let items = JSON.parse(localStorage.getItem('secure_shopping_items')) || [];
        let systemPassword = localStorage.getItem('secure_app_password');
        window.addEventListener('DOMContentLoaded', () => {
            if (!systemPassword) {
                document.getElementById('login-title').innerText = '🆕 Imposta Password';
                document.getElementById('login-desc').innerText = 'Scegli un codice segreto di sblocco per questa applicazione.';
            }
        });
        function checkPassword(e) {
            e.preventDefault();
            const input = document.getElementById('password-input').value;
            if (!systemPassword) {
                if (input.trim().length < 4) { alert("Usa almeno 4 caratteri."); return; }
                localStorage.setItem('secure_app_password', input); systemPassword = input; unlockApp();
            } else {
                if (input === systemPassword) { unlockApp(); } else { alert("Password errata!"); document.getElementById('password-input').value = ''; }
            }
        }
        function unlockApp() { document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-screen').style.display = 'block'; renderItems(); }
        function logout() { document.getElementById('password-input').value = ''; document.getElementById('app-screen').style.display = 'none'; document.getElementById('login-screen').style.display = 'flex'; }
        function saveItems() { localStorage.setItem('secure_shopping_items', JSON.stringify(items)); }
        function addItemManual(e) {
            e.preventDefault();
            const input = document.getElementById('item-input');
            const isPromo = document.getElementById('promo-checkbox').checked;
            if (input.value.trim()) { processAndAddItem(input.value.trim(), isPromo); input.value = ''; document.getElementById('promo-checkbox').checked = false; }
        }
        function processAndAddItem(text, isPromo = false) {
            let tl = text.toLowerCase();
            if (tl.includes('offerta') || tl.includes('volantino') || tl.includes('sconto')) { isPromo = true; text = text.replace(/offerta|volantino|sconto/gi, '').trim(); }
            const words = text.split(' '); let qty = 1; let name = text;
            const lastW = parseInt(words[words.length - 1]);
            if (!isNaN(lastW) && lastW > 0) { qty = lastW; words.pop(); name = words.join(' '); }
            else { const firstW = parseInt(words); if (!isNaN(firstW) && firstW > 0) { qty = firstW; words.shift(); name = words.join(' '); } }
            name = name.charAt(0).toUpperCase() + name.slice(1);
            const exist = items.find(i => i.name.toLowerCase() === name.toLowerCase() && i.promo === isPromo);
            if (exist) { exist.qty += qty; } else { items.push({ id: Date.now(), name, qty, checked: false, promo: isPromo }); }
            saveItems(); renderItems();
        }
        function toggleItem(id) { const item = items.find(i => i.id === id); if (item) { item.checked = !item.checked; saveItems(); renderItems(); } }
        function changeQuantity(id, e) {
            e.stopPropagation(); const item = items.find(i => i.id === id);
            if (item) { let n = parseInt(prompt(`Modifica quantità per ${item.name}:`, item.qty)); if (!isNaN(n) && n > 0) { item.qty = n; saveItems(); renderItems(); } }
        }
        function deleteItem(id, e) { e.stopPropagation(); items = items.filter(i => i.id !== id); saveItems(); renderItems(); }
        function clearAllItems() { if (confirm("Vuoi cancellare tutto?")) { items = []; saveItems(); renderItems(); } }
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Vocale non supportato su questo browser. Usa Safari."); return; }
            const rec = new SpeechRecognition(); rec.lang = 'it-IT';
            const btn = document.getElementById('btn-vocal'); btn.classList.add('listening'); btn.innerText = '🛑 Ascolto...';
            rec.start();
            rec.onresult = function(event) { const res = event.results[event.results.length - 1].transcript; if (res.trim()) { processAndAddItem(res.trim()); } };
            rec.onspeechend = function() { rec.stop(); resetB(); }; rec.onerror = function() { resetB(); };
            function resetB() { btn.classList.remove('listening'); btn.innerText = '🎙️ Parla'; }
        }
        function renderItems() {
            const list = document.getElementById('shopping-list'); list.innerHTML = ''; items.sort((a, b) => a.checked - b.checked);
            items.forEach(item => {
                const li = document.createElement('li'); li.className = (item.checked ? 'completed ' : '') + (item.promo ? 'is-promo-item' : '');
                li.innerHTML = `<div class="item-content" onclick="toggleItem(${item.id})"><input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem(${item.id})"><span class="item-text">${item.name}</span>${item.promo ? '<span class="promo-badge">% PROMO</span>' : ''}</div><div style="display:flex;align-items:center;"><button type="button" class="quantity-badge" onclick="changeQuantity(${item.id}, event)">x${item.qty}</button><button type="button" class="btn-delete" onclick="deleteItem(${item.id}, event)">🗑️</button></div>`;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
